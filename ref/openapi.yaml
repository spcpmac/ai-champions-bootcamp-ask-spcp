                          maxLength: 66
                    line2:
                      type: object
                      description: |-
                        Unregistered Foreign address line 2
                      properties:
                        value:
                          type: string
                          maxLength: 66
                    type:
                      default: UNFORMATTED
                      description: Type of Address (SG or UNFORMATTED for non SG).
                      enum:
                        - UNFORMATTED
                      type: string
                  title: UNFORMATTED
          examples:
