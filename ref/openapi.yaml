        regadd:
          description: >-
            Registered Address of Person (including FIN holders).


            Note:

            - Address can be either a Singapore address (type: 'SG'), non Singapore address (type: 'UNFORMATTED') or empty type address ('')

            - May be unavailable for some FIN holders.
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/Meta"
                - $ref: "#/components/schemas/UnavailableFlag"
                - type: object
                  properties:
                    block:
                      properties:
                        value:
                          maxLength: 10
                          type: string
                      type: object
                      description: Block/House of Address.
                    building:
                      properties:
                        value:
                          maxLength: 65
                          type: string
                      type: object
                      description: Building of Address.
                    country:
                      properties:
                        code:
                          default: SG
                          maxLength: 2
                          type: string
                        desc:
                          default: SINGAPORE
                          type: string
                      type: object
                      description: >-
                        Country/Place of Address. For AddressSG this will always be 'SG'.
                    floor:
                      properties:
                        value:
                          maxLength: 3
                          type: string
                      type: object
                      description: Floor of Address.
                    postal:
                      properties:
                        value:
                          maxLength: 6
                          type: string
                      type: object
                      description: Postal Code of Address.
                    street:
                      properties:
                        value:
                          maxLength: 66
                          type: string
                      type: object
                      description: Street of Address.
                    type:
                      default: SG
                      description: Type of Address (SG or UNFORMATTED for non SG).
                      enum:
                        - SG
                      type: string
                    unit:
                      properties:
                        value:
                          maxLength: 5
                          type: string
                      type: object
                      description: Unit of Address.
                  title: SG
