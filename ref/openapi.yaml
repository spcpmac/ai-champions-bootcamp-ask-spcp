    Person:
      type: object
      description: Person details
      additionalProperties: false
      properties:
        academicqualifications:
          description: Academic qualifications achieved.
          allOf:
            - $ref: "#/components/schemas/Meta"
            - $ref: "#/components/schemas/UnavailableFlag"
            - type: object
              properties:
                certificates:
                  description: Electronic certificates uploaded.
                  items:
                    additionalProperties: false
                    properties:
                      content:
                        properties:
                          value:
                            type: string
                        type: object
                        description: File content of the electronic certificate, Base64 encoded.
                      name:
                        properties:
                          value:
                            type: string
                        type: object
                        description: File name of the electronic certificate.
                      opencertificate:
                        properties:
                          id:
                            properties:
                              value:
                                type: string
                            type: object
                          primary:
                            properties:
                              value:
                                type: boolean
                            type: object
                        type: object
                        description: |-
                          Open Certificate Information.

                          Note: The test environment for OpenCert is at https://dev.opencerts.io/
                          while production is at https://opencerts.io/
                      opencertificateindicator:
                        properties:
                          value:
                            type: boolean
                        type: object
                        description: Indicate whether this file is open certificate.
                    type: object
                  type:
                    - array
                    - "null"
                  examples:
                    - name:
                        value: nus.opencert
                      content:
                        value: "base64-string"
                      opencertificate:
                        id:
                          value: 100000000343840
                        primary:
                          value: true
                      opencertificateindicator:
                        value: true
                transcripts:
                  description: Transcript of qualification.
                  items:
                    properties:
                      explanatorynotes:
                        description: >-
                          Explanatory Notes. For an example, see https://public.cloud.myinfo.gov.sg/myinfo/spm/seab-explanatory-notes/SEAB_Cert_A.html
                        properties:
                          value:
                            type: string
                        type: object
                        examples:
                          - "https://public.cloud.myinfo.gov.sg/myinfo/spm/seab-explanatory-notes/SEAB_Cert_A.html"
                      name:
                        description: Qualification's Name.
                        properties:
                          value:
                            type: string
                        type: object
                      results:
                        description: Array of results for the qualification.
                        items:
                          examples:
                            - grade:
                                value: A ONE
                              level:
                                value: ORDINARY
                              subgrade:
                                value: PASS
                              subject:
                                value: CHINESE
                              subsubject:
                                value: ORAL/AURAL
                          properties:
                            grade:
                              description: Grade attained.
                              properties:
                                value:
                                  type: string
                              type: object
                            level:
                              description: Level of subject taken.
                              properties:
                                value:
                                  type: string
                              type: object
                            subgrade:
                              description: Optional grade attained for subSubject.
                              properties:
                                value:
                                  type: string
                              type: object
                            subject:
                              description: Subject taken.
                              properties:
                                value:
                                  type: string
                              type: object
                            subsubject:
                              description: Optional Sub Subject taken.
                              properties:
                                value:
                                  type: string
                              type: object
                          title: SSGResult
                          type: object
                        type: array
                      yearattained:
                        description: >-
                          Year this qualification was attained. See "date-fullyear" in https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        properties:
                          value:
                            pattern: "[0-9]{4}"
                            type: string
                        type: object
                        examples:
                          - "2019"
                    type: object
                  type:
                    - array
                    - "null"
          examples:
            - certificates:
                - name:
                    value: nus.opencert
                  content:
                    value: "base64-string"
                  opencertificate:
                    id:
                      value: "100000000343840"
                    primary:
                      value: true
                  opencertificateindicator:
                    value: true
              transcripts:
                - name:
                    value: SINGAPORE-CAMBRIDGE GENERAL CERTIFICATE OF EDUCATION ORDINARY LEVEL
                  yearattained:
                    value: "2018"
                  results:
                    - subject:
                        value: English Language
                      level:
                        value: Ordinary
                      grade:
                        value: A
                      subsubject:
                        value: SPECIAL PAPER
                      subgrade:
                        value: One
                  explanatorynotes:
                    value: https://public.cloud.myinfo.gov.sg/myinfo/spm/seab-explanatory-notes/SEAB_Cert_A.html
              classification: C
              source: "1"
              lastupdated: "2019-03-26"
        aliasname:
          description: Alias name of the Person
          allOf:
            - $ref: "#/components/schemas/Meta"
            - $ref: "#/components/schemas/UnavailableFlag"
            - type: object
              properties:
                value:
                  maxLength: 66
                  type: string
                  examples:
                    - TRICIA TAN XIAO HUI
          examples:
            - value: TRICIA TAN XIAO HUI
              classification: C
              source: "1"
              lastupdated: "2019-03-26"
        birthcountry:
          description: |-
            Country/Place of Birth of Person.

            Refer to the Code reference tables in the Support section for list of possible values.
          allOf:
            - $ref: "#/components/schemas/Meta"
            - $ref: "#/components/schemas/UnavailableFlag"
            - type: object
              properties:
                code:
                  maxLength: 2
                  pattern: "^(?:[A-Za-z]{2})?$"
                  type: string
                  examples:
                    - "SG"
                desc:
                  maxLength: 300
                  type: string
                  examples:
                    - "SINGAPORE"
          examples:
            - code: SG
              desc: SINGAPORE
              classification: C
              source: "1"
              lastupdated: "2019-03-26"
        chas:
          description: Community Health Assist Scheme (CHAS) card details - Card Type, Date of Issue, Date of Expiry
          examples:
            - cardtype:
                code: C
                desc: Green
              indicator:
                code: C
                desc: Green
              expirydate:
                value: 2020-06-15
              issuedate:
                value: 2020-06-15
              lastupdated: "2019-03-26"
              name:
                value: TAN XIAO HUI
              classification: C
              source: "1"
          allOf:
            - $ref: "#/components/schemas/Meta"
            - $ref: "#/components/schemas/UnavailableFlag"
            - type: object
              properties:
                cardtype:
                  properties:
                    code:
                      enum:
                        - A
                        - B
                        - C
                        - NA
                      type: string
                    desc:
                      type: string
                  type: object
                  description: CHAS Card Type.
                expirydate:
                  properties:
                    value:
                      format: date
                      maxLength: 10
                      type: string
                  type: object
                  description: |-
                    CHAS Expiry Date. Value of data field in YYYY-MM-DD format.
                    See "full-date" in https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                indicator:
                  properties:
                    code:
                      enum:
                        - PGA
                        - PGB
                        - PGC
                        - MGA
                        - MGB
                        - MGC
                        - PG
                        - MG
                        - A
                        - B
                        - C
                        - NA
                      type: string
                    desc:
                      type: string
                  type: object
                  description: CHAS Indicator.
                issuedate:
                  properties:
                    value:
                      format: date
                      maxLength: 10
                      type: string
                  type: object
                  description: |-
                    CHAS Issue Date. Value of data field in YYYY-MM-DD format.
                    See "full-date" in https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                name:
                  properties:
                    value:
                      maxLength: 66
                      type: string
                  type: object
                  description: Full Name of the Person.
        childrenbirthrecords:
          description: >-
            This refers to only local registered birth records (based on ICA’s electronic Birth Certificate Records from 1985 onwards).

            This includes adoption of locally registered child.

            For child below 21, the child’s Birth Cert No, Name, Sex, Race, Dialect, Date of Birth and Time of Birth will be shown.

            For child above 21, only the child’s Birth Cert Number will be shown.
          items:
            allOf:
              - $ref: "#/components/schemas/Meta"
              - $ref: "#/components/schemas/UnavailableFlag"
              - type: object
                properties:
                  aliasname:
                    properties:
                      value:
                        maxLength: 66
                        type: string
                    type: object
                    description: |-
                      Alias name of child.

                      Presentation Logic - If there is a value to aliasname (i.e. not empty), then aliasname should be
                      displayed in a new line below hanyupinyinname, and prefixed with the '@' symbol i.e. '@aliasname'.
                  birthcertno:
                    properties:
                      value:
                        maxLength: 15
                        type: string
                    type: object
                    description: Birth certificate number of child.
                  dialect:
                    properties:
                      code:
                        maxLength: 2
                        pattern: "^(?:[A-Za-z]{2})?$"
                        type: string
                      desc:
                        maxLength: 300
                        type: string
                    type: object
                    description: |-
                      Dialect of child.
                      Refer to the Code reference tables in the Support section for list of possible values.
                  dob:
                    properties:
                      value:
                        description: >-
                          Value of data field in YYYY-MM-DD format. See "full-date" in https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        format: date
                        type: string
                    type: object
                    description: Date of Birth of child.
                  hanyupinyinaliasname:
                    properties:
                      value:
                        maxLength: 66
                        type: string
                    type: object
                    description: |-
                      Han Yu Pin Yin Alias name of child.

                      Presentation Logic - If there is a value to hanyupinyinaliasname (i.e. not empty), then
                      hanyupinyinaliasname should be displayed in a new line below aliasname, and prefixed with
                      the '@' symbol i.e. "@hanyupinyinaliasname".
                  hanyupinyinname:
                    properties:
                      value:
                        maxLength: 66
                        type: string
                    type: object
                    description: |-
                      Han Yu Pin Yin name of child.

                      Presentation Logic - If there is a value to hanyupinyinname (i.e. not empty), then hanyupinyinname
                      should be displayed in a new line below name, and formatted with round brackets
                      i.e. "(hanyupinyinname)".
                  lifestatus:
                    properties:
                      code:
                        enum:
                          - A
                          - D
                          - ""
                        type: string
                      desc:
                        enum:
                          - ALIVE
                          - DECEASED
                          - ""
                        type: string
                    type: object
                    description: |-
                      Life Status of child. Possible values:

                      - A - ALIVE
                      - D - DECEASED
                  marriedname:
                    properties:
                      value:
                        maxLength: 66
                        type: string
                    type: object
                    description: |-
                      Married name of child.

                      Presentation Logic - If there is a value to marriedname (i.e. not empty),
                      then marriedname should be displayed in a new line below hanyupinyinaliasname.
                  name:
                    properties:
                      value:
                        maxLength: 66
                        type: string
                    type: object
                    description: Full Name of child.
                  race:
                    properties:
                      code:
                        maxLength: 2
                        pattern: "^(?:[A-Za-z]{2})?$"
                        type: string
                      desc:
                        maxLength: 300
                        type: string
                    type: object
                    description: |-
                      Race of child.
                      Refer to the Code reference tables in the Support section for list of possible values.
                  secondaryrace:
                    properties:
                      code:
                        maxLength: 2
                        pattern: "^(?:[A-Za-z]{2})?$"
                        type: string
                      desc:
                        maxLength: 300
                        type: string
                    type: object
                    description: |-
                      Secondary Race of child.
                      Refer to the Code reference tables in the Support section for list of possible values.
                  sex:
                    properties:
                      code:
                        description: |-
                          The 1-character code for the sex.

                          - 'F': FEMALE
                          - 'M': MALE
                          - 'U': UNKNOWN
                          - '': No Data Yet
                        enum:
                          - F
                          - M
                          - U
                          - ""
                        maxLength: 1
                        type: string
                      desc:
                        description: The full description of the sex.
                        enum:
                          - FEMALE
                          - MALE
                          - UNKNOWN
                          - ""
                        type: string
                    type: object
                    description: Sex of child.
                  sgcitizenatbirthind:
                    properties:
                      value:
                        enum:
                          - "Y"
                          - "N"
                          - ""
                        type: string
                    type: object
                    description: |-
                      Indicates whether the child is a Singapore Citizen at the time of birth. Possible values:

                      - Y - YES
                      - N - NO
                      - < BLANK > - Not applicable
                  tob:
                    properties:
                      value:
                        description: "Format: HHMM"
                        maxLength: 4
                        type: string
                    type: object
                    description: Time of Birth of child.
                  vaccinationrequirements:
                    items:
                      additionalProperties: false
                      properties:
                        fulfilled:
                          properties:
                            value:
                              type: boolean
                          type: object
                        requirement:
                          properties:
                            code:
                              type: string
                            desc:
                              type: string
                          type: object
                          description: |-
                            Vaccination Requirement.
                            Refer to the Code reference tables in the Support section for list of possible values.
                      type: object
                    type:
                      - array
                      - "null"
            examples:
              - birthcertno:
                  value: S5562882C
                name:
                  value: Jo Tan Pei Ni
                hanyupinyinname:
                  value: Cheng Pei Ni
                aliasname:
                  value: "Pei Ni"
                hanyupinyinaliasname:
                  value: "Pei Ni"
                marriedname:
                  value: "Pei Ni"
                sex:
                  code: F
                  desc: FEMALE
                race:
                  code: CN
                  desc: CHINESE
                secondaryrace:
                  code: ""
                  desc: ""
                dialect:
                  code: HK
                  desc: HOKKIEN
                lifestatus:
                  code: D
                  desc: DECEASED
