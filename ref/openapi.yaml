    Country:
      type: object
      properties:
        code:
          type: string
          examples:
            - SG
          title: code
          maxLength: 2
          minLength: 2
          description: |-
            Country code. Refer to [ISO 3166](https://www.iso.org/iso-3166-country-codes.html) for possible values.
        desc:
          type: string
          examples:
            - Singapore
          title: desc
          maxLength: 100
          description: Country name.
      title: Country
    Entity:
      type: object
      properties:
        basic_profile:
          type: object
          properties:
            registration_number:
              title: registration_number
              description: |-
                Unique Entity Number (UEN).
                 Applicable for all entity types.
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - type: object
                  required:
                    - value
                  properties:
                    value:
                      type: string
                      examples:
                        - T15LP0010D
                      title: value
                      maxLength: 10
            name:
              title: name
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - $ref: "#/components/schemas/EntityName"
            type:
              title: type
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - $ref: "#/components/schemas/EntityType"
            uen_status:
              title: uen_status
              description: |-
                UEN registration status.
                 Applicable for all entity types.
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - type: object
                  properties:
                    code:
                      type: string
                      examples:
                        - R
                      title: code
                      enum:
                        - D
                        - R
                        - W
                      description: |-
                        Possible values:
                        * 'D' - Deregistered
                        * 'R' - Registered
                        * 'W' - Withdrawn
                    desc:
                      type: string
                      examples:
                        - Registered
                      title: desc
                      enum:
                        - Deregistered
                        - Registered
                        - Withdrawn
            constitution:
              title: constitution
              description: |-
                Constitution of Business or Public Accounting Firms.
                 Applicable for entity types: BN, PF.
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - type: object
                  properties:
                    code:
                      type: string
                      examples:
                        - S
                      title: code
                      enum:
                        - S
                        - P
                      description: |-
                        Possible values:
                        * 'S' - Sole-Proprietor
                        * 'P' - Partner
                    desc:
                      type: string
                      examples:
                        - Sole-Proprietor
                      title: desc
                      enum:
                        - Sole-Proprietor
                        - Partner
            company_type:
              title: company_type
              description: |-
                Type of company.
                 Applicable for entity types: LC, FC.
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - type: object
                  properties:
                    code:
                      type: string
                      examples:
                        - A1
                      title: code
                      enum:
                        - A1
                        - A3
                        - A4
                        - B1
                        - B2
                        - B3
                        - B4
                        - F1
                      description: |-
                        Possible values:
                        * A1 - Public Company Limited by Shares
                        * A3 - Public Company Limited by Guarantee
                        * A4 - Unlimited Public Company
                        * B1 - Private Company Limited by Shares
                        * B2 - Exempt Private Company Limited by Shares
                        * B3 - Unlimited Private Company
                        * B4 - Unlimited Exempt Private Company
                        * F1 - Foreign Company Registered in Singapore
                    desc:
                      type: string
                      examples:
                        - Public Company Limited by Shares
                      title: desc
                      enum:
                        - Public Company Limited by Shares
                        - Public Company Limited by Guarantee
                        - Unlimited Public Company
                        - Private Company Limited by Shares
                        - Exempt Private Company Limited by Shares
                        - Unlimited Private Company
                        - Unlimited Exempt Private Company
                        - Foreign Company Registered in Singapore
            country_of_incorporation:
              title: country_of_incorporation
              description: |-
                Country of incorporation using ISO 3166-1 alpha-2 standard.
                 Refer to [ISO 3166](https://www.iso.org/iso-3166-country-codes.html) for possible values.
                 Applicable for entity types: LC, FC, UL, UF.
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - $ref: "#/components/schemas/Country"
            registration_date:
              title: registration_date
              description: |-
                Registration date.
                 Applicable for all entity types except UL, UF.
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - type: object
                  properties:
                    value:
                      type: string
                      format: date
                      examples:
                        - "2023-12-31"
                      title: value
                      description: |-
                        See [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) "full-date"
                        format "YYYY-MM-DD".
            expiry_date:
              title: expiry_date
              description: |-
                Expiry date.
                 Applicable for entity types: BN, LP.
              type: object
              allOf:
                - $ref: "#/components/schemas/Meta"
                - type: object
                  properties:
                    value:
                      type: string
                      format: date
                      examples:
                        - "2023-12-31"
                      title: value
                      description: |-
                        See [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) "full-date"
                        format "YYYY-MM-DD".
            primary_activity:
              title: primary_activity
              description: |-
                Primary activity using Singapore Standard Industrial Classification (SSIC) 2025 edition.
                 Applicable for all entity types except UL, UF.
              type: object
              allOf:
                - $ref: "#/components/schemas/SsicActivity"
                - $ref: "#/components/schemas/Meta"
            secondary_activity:
              title: secondary_activity
              description: |-
                Secondary activity using Singapore Standard Industrial Classification (SSIC) 2025 edition.
                 Applicable for all entity types except UL, UF.
              type: object
              allOf:
