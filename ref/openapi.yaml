                category:
                  description: Type of 'Notice of Assessment' (NOA).
                  properties:
                    value:
                      enum:
                        - ADDITIONAL
                        - AMENDED
                        - ORIGINAL
                        - REPAYMENT
                      type: string
                  type: object
                employment:
                  description: Assessable Income from employment for the latest NOA.
                  properties:
                    value:
                      format: double
                      type: number
                  type: object
                interest:
                  description: Assessable Income from interest for the latest NOA.
                  properties:
                    value:
                      format: double
                      type: number
                  type: object
                rent:
                  description: Assessable Income from rent for the latest NOA.
                  properties:
                    value:
                      format: double
                      type: number
                  type: object
                taxclearance:
                  description: Tax Clearance indicator.
                  properties:
                    value:
                      enum:
                        - "Y"
                        - "N"
                      maxLength: 1
                      type: string
                  type: object
                trade:
                  description: Assessable Income from trade for the latest NOA.
                  properties:
                    value:
                      format: double
                      type: number
                  type: object
                yearofassessment:
                  description: The year of assessment (YYYY) for the latest NOA.
                  properties:
