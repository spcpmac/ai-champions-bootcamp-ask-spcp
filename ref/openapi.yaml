                  maxLength: 1
                  pattern: "^[A-Za-z]{0,1}$"
                  type: string
                  examples:
                    - "C"
                desc:
                  enum:
                    - ALIEN
                    - CITIZEN
                    - PR
                    - UNKNOWN
                    - NOT APPLICABLE
                    - ""
                  maxLength: 300
                  type: string
                  examples:
